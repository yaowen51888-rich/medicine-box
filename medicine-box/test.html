<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>药箱管家 · 自检</title>
</head>
<body>
<h1>纯函数自检</h1>
<div id="result">运行中…</div>
<script src="app.js"></script>
<script>
const results = [];
function check(fn, msg) {
  try { results.push([!!fn(), msg]); }
  catch (e) { results.push([false, msg + " — " + e.message]); }
}

const T = new Date(2026, 9, 29); // 2026-10-29 本地
check(() => daysUntil("2026-10-29", T) === 0, "当天=0");
check(() => daysUntil("2026-10-28", T) === -1, "昨天=-1");
check(() => daysUntil("2026-11-28", T) === 30, "30天后=30");
check(() => daysUntil("2027-01-01", new Date(2026, 11, 31)) === 1, "跨年");
check(() => daysUntil("2027-02-28", new Date(2027, 1, 27)) === 1, "月末");
check(() => statusOf("2026-10-29", T, 30) === "expiring", "剩0天=expiring");
check(() => statusOf("2026-10-28", T, 30) === "expired", "过期1天=expired");
check(() => statusOf("2026-11-28", T, 30) === "expiring", "剩30天=expiring");
check(() => statusOf("2026-11-29", T, 30) === "ok", "剩31天=ok");
check(() => statusOf("2026-11-06", T, 7) === "ok", "自定义remindDays");

function renderResults() {
  const el = document.getElementById("result");
  const passed = results.filter(r => r[0]).length;
  const failed = results.length - passed;
  el.innerHTML = results.map(r =>
    `<div style="color:${r[0] ? "green" : "red"}">${r[0] ? "✓" : "✗"} ${r[1]}</div>`
  ).join("") + `<p><b>${passed} passed, ${failed} failed</b></p>`;
  console.log(`${passed} passed, ${failed} failed`);
}
renderResults();
</script>
</body>
</html>

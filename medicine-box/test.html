<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>药箱管家 · 自检</title>
</head>
<body>
<h1>纯函数自检</h1>
<div id="result">运行中…</div>
<script src="app.js"></script>
<script>
const results = [];
function check(fn, msg) {
  try { results.push([!!fn(), msg]); }
  catch (e) { results.push([false, msg + " — " + e.message]); }
}
async function checkA(fn, msg) {
  try { results.push([!!(await fn()), msg]); }
  catch (e) { results.push([false, msg + " — " + e.message]); }
}

const T = new Date(2026, 9, 29); // 2026-10-29 本地
check(() => daysUntil("2026-10-29", T) === 0, "当天=0");
check(() => daysUntil("2026-10-28", T) === -1, "昨天=-1");
check(() => daysUntil("2026-11-28", T) === 30, "30天后=30");
check(() => daysUntil("2027-01-01", new Date(2026, 11, 31)) === 1, "跨年");
check(() => daysUntil("2027-02-28", new Date(2027, 1, 27)) === 1, "月末");
check(() => statusOf("2026-10-29", T, 30) === "expiring", "剩0天=expiring");
check(() => statusOf("2026-10-28", T, 30) === "expired", "过期1天=expired");
check(() => statusOf("2026-11-28", T, 30) === "expiring", "剩30天=expiring");
check(() => statusOf("2026-11-29", T, 30) === "ok", "剩31天=ok");
check(() => statusOf("2026-11-06", T, 7) === "ok", "自定义remindDays");

// AI 模块
let P; try { P = parseAIResponse; } catch (e) {}
check(() => JSON.stringify(P('{"name":"布洛芬缓释胶囊","expiry":"2027-05-31"}')) === '{"name":"布洛芬缓释胶囊","expiry":"2027-05-31"}', "正常JSON");
check(() => JSON.stringify(P('```json\n{"name":"感冒灵颗粒","expiry":null}\n```')) === '{"name":"感冒灵颗粒","expiry":null}', "围栏剥离");
check(() => P('{"name":"x","expiry":"2027/05/31"}').expiry === null, "非法日期→null");
check(() => P("前置说明 {\"name\":\"y\",\"expiry\":\"2027-05-31\"} 后缀").name === "y", "前后杂文本");
check(() => P("完全不是JSON").name === null && P("完全不是JSON").expiry === null, "垃圾文本→双null");
// M2: 日历有效性（正则只管格式，不管真实日期）
check(() => P('{"name":"x","expiry":"2027-02-30"}').expiry === null, "2月30日→null");
check(() => P('{"name":"x","expiry":"2027-13-01"}').expiry === null, "13月→null");
check(() => P('{"name":"x","expiry":"2027-02-28"}').expiry === "2027-02-28", "平年2-28保留");
check(() => P('{"name":"x","expiry":"2028-02-29"}').expiry === "2028-02-29", "闰年2-29保留");
check(() => {
  const body = buildVisionBody("QUJD", "glm-4v-flash");
  return body.model === "glm-4v-flash" && body.response_format.type === "json_object";
}, "body结构");
check(() => buildVisionBody("QUJD", "m").messages[0].content[0].image_url.url === "data:image/jpeg;base64,QUJD", "图片dataURL");
check(() => buildVisionBody("QUJD", "m").messages[0].content[1].text === AI_PROMPT, "prompt进body");

(async () => {
  // cfg 默认值与回写
  await checkA(() => getCfg().base === "https://open.bigmodel.cn/api/paas/v4"
    && getCfg().model === "glm-4v-flash" && getCfg().remindDays === 30, "cfg默认值");
  await checkA(() => {
    saveCfg({ remindDays: 7, key: "sk-test" });
    return getCfg().remindDays === 7 && getCfg().key === "sk-test";
  }, "cfg回写");
  try { saveCfg({ remindDays: 30, key: "" }); } catch (e) {}

  // db 往返
  let id, m;
  await checkA(async () => {
    id = await dbAdd({ name: "测试药", expiry: "2027-01-01", note: "", photo: null });
    return typeof id === "number" && id >= 1;
  }, "add返回自增id");
  await checkA(async () => {
    m = await dbGet(id);
    return !!m && m.name === "测试药" && m.status === "active" && m.createdAt > 0;
  }, "get字段完整");
  await checkA(async () => {
    m.expiry = "2028-01-01"; m.status = "disposed";
    await dbUpdate(m);
    return (await dbGet(id)).expiry === "2028-01-01";
  }, "update生效");
  await checkA(async () => {
    await dbDelete(id);
    return (await dbGet(id)) === undefined;
  }, "delete生效");

  // AI 失败原因（spec §8：行内提示原因）
  await checkA(async () => {
    saveCfg({ key: "" });
    const r = await callVisionAPI("QQ==");
    return r.ok === false && r.reason.indexOf("Key") >= 0;
  }, "无Key→原因");
  await checkA(async () => {
    saveCfg({ key: "sk-x", base: "https://example.invalid/v4/" });
    const realFetch = window.fetch;
    let calledUrl = "";
    window.fetch = async u => { calledUrl = u; return new Response('{"choices":[{"message":{"content":"{}"}}]}', { status: 200 }); };
    const r = await callVisionAPI("QQ==");
    window.fetch = realFetch;
    return calledUrl === "https://example.invalid/v4/chat/completions" && r.ok === true;
  }, "base末尾斜杠归一+正常返回");
  await checkA(async () => {
    saveCfg({ key: "sk-x" });
    const realFetch = window.fetch;
    window.fetch = async () => new Response("{}", { status: 401 });
    const r = await callVisionAPI("QQ==");
    window.fetch = realFetch;
    return r.ok === false && r.reason.indexOf("Key") >= 0;
  }, "401→Key无效原因");
  await checkA(async () => {
    const realFetch = window.fetch;
    window.fetch = async () => { throw new Error("net"); };
    const r = await callVisionAPI("QQ==");
    window.fetch = realFetch;
    return r.ok === false && r.reason === "网络错误或超时";
  }, "网络错误→原因");
  try { saveCfg({ key: "", base: "" }); } catch (e) {}

  renderResults();
})();

function renderResults() {
  const el = document.getElementById("result");
  const passed = results.filter(r => r[0]).length;
  const failed = results.length - passed;
  el.innerHTML = results.map(r =>
    `<div style="color:${r[0] ? "green" : "red"}">${r[0] ? "✓" : "✗"} ${r[1]}</div>`
  ).join("") + `<p><b>${passed} passed, ${failed} failed</b></p>`;
  console.log(`${passed} passed, ${failed} failed`);
}
</script>
</body>
</html>

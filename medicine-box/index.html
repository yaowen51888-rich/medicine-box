<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>药箱管家 · 家庭药品效期提醒</title>
<meta name="description" content="拍照录入药品，自动识别药名和有效期，过期前提醒你该扔的药。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <!-- 首页 -->
  <section id="view-home" class="view">
    <header class="page-head">
      <h1>药箱管家</h1>
      <p class="sub">过期药一眼看清，该扔就扔</p>
    </header>

    <div id="storage-banner" class="banner" hidden role="alert">
      存储不可用，请换浏览器或关闭隐私模式
    </div>

    <div id="stats" class="stats" aria-live="polite"></div>

    <div id="home-empty" class="empty" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M12 11v5M9.5 13.5h5"/></svg>
      </div>
      <p class="empty-title">药箱还是空的</p>
      <p class="empty-sub">拍下第一盒药，效期交给我们盯</p>
      <a class="btn btn-primary" href="#/add">拍照录入</a>
    </div>

    <div id="home-list"></div>

    <button id="fab-add" class="fab" type="button" aria-label="拍照录入">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </section>

  <!-- 录入 -->
  <section id="view-add" class="view" hidden>
    <header class="page-head">
      <h1>拍照录入</h1>
      <p class="sub">拍药盒正面，药名和效期自动填好</p>
    </header>

    <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>

    <button id="pick-photo" class="btn btn-primary btn-block" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" aria-hidden="true"><path d="M7 8V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/><rect x="3" y="8" width="18" height="13" rx="3"/><path d="M12 12v4M10 14h4"/></svg>
      拍照或选择图片
    </button>

    <div id="photo-preview-wrap" hidden>
      <img id="photo-preview" class="photo-preview" alt="药品照片预览">
      <p id="recognize-status" class="recognize-status" aria-live="polite"></p>
    </div>

    <form id="add-form" novalidate>
      <div class="field">
        <label for="f-name">药名</label>
        <input id="f-name" type="text" autocomplete="off" placeholder="如：布洛芬缓释胶囊">
        <p class="field-error" hidden>请填写药名</p>
      </div>
      <div class="field">
        <label for="f-expiry">有效期至</label>
        <input id="f-expiry" type="date">
        <p class="field-error" hidden>请选择有效期</p>
      </div>
      <div class="field">
        <label for="f-note">备注</label>
        <input id="f-note" type="text" placeholder="选填，如：妈妈的降压药">
      </div>
      <button type="submit" class="btn btn-primary btn-block">保存</button>
    </form>
  </section>

  <!-- 详情 -->
  <section id="view-detail" class="view" hidden>
    <header class="page-head">
      <h1>药品详情</h1>
      <p class="sub">核对信息，处理过期药</p>
    </header>

    <div id="detail-photo"></div>

    <form id="detail-form" novalidate>
      <div class="field">
        <label for="d-name">药名</label>
        <input id="d-name" type="text" autocomplete="off">
        <p class="field-error" hidden>请填写药名</p>
      </div>
      <div class="field">
        <label for="d-expiry">有效期至</label>
        <input id="d-expiry" type="date">
        <p class="field-error" hidden>请选择有效期</p>
      </div>
      <div class="field">
        <label for="d-note">备注</label>
        <input id="d-note" type="text">
      </div>
      <button type="submit" class="btn btn-primary btn-block">保存修改</button>
    </form>

    <div class="danger-zone">
      <button id="btn-dispose" class="btn btn-block" type="button">已扔掉 / 已用完</button>
      <button id="btn-delete" class="btn btn-danger btn-block" type="button">删除记录</button>
    </div>
  </section>

  <!-- 设置 -->
  <section id="view-settings" class="view" hidden>
    <header class="page-head">
      <h1>设置</h1>
      <p class="sub">识别服务与提醒偏好</p>
    </header>

    <form id="settings-form" novalidate>
      <div class="field">
        <label for="s-base">API 地址</label>
        <input id="s-base" type="text" placeholder="https://open.bigmodel.cn/api/paas/v4">
      </div>
      <div class="field">
        <label for="s-key">API Key</label>
        <input id="s-key" type="password" placeholder="仅存于本机浏览器">
      </div>
      <div class="field">
        <label for="s-model">模型</label>
        <input id="s-model" type="text" placeholder="glm-4v-flash">
      </div>
      <div class="field">
        <label for="s-remind">提前提醒天数</label>
        <input id="s-remind" type="number" min="0" placeholder="30">
      </div>
      <button type="submit" class="btn btn-primary btn-block">保存设置</button>
      <p id="settings-saved" class="recognize-status" aria-live="polite"></p>
    </form>

    <p class="settings-foot">Key 仅存于本机浏览器，用于直接调用你自己配置的识别服务。</p>
  </section>

</main>

<nav class="tabbar" aria-label="主导航">
  <a href="#/" data-nav="/" class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
    <span>药箱</span>
  </a>
  <a href="#/add" data-nav="/add" class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/><rect x="3" y="8" width="18" height="13" rx="3"/><path d="M12 12v4M10 14h4"/></svg>
    <span>录入</span>
  </a>
  <a href="#/settings" data-nav="/settings" class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>设置</span>
  </a>
</nav>

<script src="app.js"></script>
</body>
</html>
